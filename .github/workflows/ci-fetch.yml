# Data fetch lane — the needs-human drill (self-heal).
# The job INTENTIONALLY references a repository VARIABLE (DATA_SOURCE_URL)
# that is deliberately NOT configured: its correct value can only be supplied
# by the repository owner (a real dataset location). The expected failure —
# `DATA_SOURCE_URL: unbound variable` — is the canonical needs-human shape:
# no code change can fix it, only owner-supplied configuration can.
# Self-heal keys incidents by FILENAME (wf:ci-fetch.yml).
name: CI Fetch

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-fetch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch:
    name: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch dataset from DATA_SOURCE_URL
        # NOTE: DATA_SOURCE_URL is intentionally unconfigured (repo variable).
        # Do NOT hardcode a URL here — the drill tests that self-heal routes
        # missing owner-supplied configuration to needs-human, not to a fix.
        run: |
          set -euo pipefail
          curl -fsSL "${DATA_SOURCE_URL}/dataset.json" -o /tmp/dataset.json
          wc -c /tmp/dataset.json
