# Parameterized drill lane — group-detector test for the self-heal.
# run-name CONTRACT: the FIRST token is the stable group key
# (`param-<mode>`), so interleaved green runs of other parameters never
# reset this group's failure streak. Every dispatched mode exits 0
# (healed gh-31/gh-33: bin/param_app.dart summarizes any mode, including
# ones without a data entry) — the shared test suite is untouched.
name: Params Drill

# Run-name contract: the FIRST token is the stable group key (param-<mode>)
# — the group detector keys groups on exactly this token.
run-name: 'param-${{ inputs.mode }} — params drill'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'mode to drill — any mode exits 0 (healed gh-31/gh-33)'
        required: false
        default: 'good'
        type: string

concurrency:
  group: params-drill-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Run params probe
        run: dart run bin/param_app.dart "${{ inputs.mode }}"
