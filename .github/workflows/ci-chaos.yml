# CHAOS PROBE — READ ME BEFORE TOUCHING:
# EVERYTHING in this file is intentional. Dynamic seeds, deterministic reds,
# deliberately "missing" configs — this lane is the live-fire target of the
# self-heal loop. It is NOT broken. DO NOT "fix" it. DO NOT touch it.
# Ownership: human. A pull request that "closes" this lane violates its design.
name: Chaos Drill
run-name: 'chaos-${{ inputs.seed }} — chaos probe'
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'dynamic chaos seed (resolved per dispatch — this is the point)'
        required: false
        default: 'drill-42'
jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - name: Chaos probe
        run: |
          SEED="${{ inputs.seed }}"
          echo "chaos seed: $SEED (dynamic, resolved at dispatch time)"
          # NO failures here — this lane is GREEN by design. The drill checks
          # how the loop treats a healthy lane it does not understand.
          echo "chaos green for seed $SEED"
