# Geo Probe — a parameterized lane registered in LEG_WORKFLOWS.
# Drill: its run-name LEADS WITH A LITERAL (emoji), hiding the group key —
# the run-name contract scanner must flag it and the dev leg must fix it.
name: Geo Probe

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to probe'
        required: false
        default: 'eu'

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe region
        run: echo "probing region: ${{ inputs.region }}"
