# Geo Probe — a parameterized lane registered in LEG_WORKFLOWS.
# gh-55: its run-name used to lead with a literal (emoji), hiding the group
# key — the contract scanner flagged it and the dev leg fixed it (below).
name: Geo Probe

# Run-name contract: the FIRST token is the stable group key (geo-<region>)
# — the group detector keys groups on exactly this token.
run-name: 'geo-${{ inputs.region }} — geo probe'

# workflow_dispatch ONLY: the lane is parameterized (region input); a push has
# no region to pass, so running it on push would probe an arbitrary default.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to probe'
        required: false
        default: 'eu'

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe region
        env:
          # gh-68: `region` is a workflow_dispatch-only input, so on push
          # runs `${{ inputs.region }}` interpolates EMPTY and the guard
          # collapsed to regions/.conf (9/9 red). Fall back to the dispatch
          # default; the env mapping also keeps the free-typed dispatch
          # input out of the bash script (no script-injection surface).
          REGION: ${{ inputs.region || 'eu' }}
        run: |
          test -f "regions/${REGION}.conf" || {
            echo "region config missing: regions/${REGION}.conf" >&2
            exit 1
          }
          echo "probing region: ${REGION}"
